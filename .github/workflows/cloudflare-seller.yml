# Cloudflare seller worker — PR verify + deploy on main.
# Runtime BYOK keys (UNDERWRITE_*, NEURALAKE_*, webhook HMAC) are NOT set here.
# Put those on the Worker with `wrangler secret put` or the Cloudflare dashboard.
name: Cloudflare seller

on:
  pull_request:
    paths:
      - "workers/cloudflare-seller/**"
      - ".github/workflows/cloudflare-seller.yml"
  push:
    branches: [main]
    paths:
      - "workers/cloudflare-seller/**"
      - ".github/workflows/cloudflare-seller.yml"

concurrency:
  group: cloudflare-seller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/cloudflare-seller

jobs:
  check:
    name: Typecheck, test, dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install worker package
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @underwrite/cloudflare-seller...

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Bundles only — no Cloudflare token, no runtime secrets.
      - name: Wrangler dry-run
        run: pnpm run dry-run

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install worker package
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @underwrite/cloudflare-seller...

      - name: Require Cloudflare deploy secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Set repo secret CLOUDFLARE_API_TOKEN (Cloudflare API token with Workers Edit)."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Set repo secret CLOUDFLARE_ACCOUNT_ID (Workers overview → Account ID)."
            missing=1
          fi
          exit "${missing}"

      # `pnpm deploy` is pnpm's workspace-publish command (ERR_PNPM_NOTHING_TO_DEPLOY).
      - name: Wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
